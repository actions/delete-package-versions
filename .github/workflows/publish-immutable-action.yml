name: "Publish Immutable Action Version"

on:
  release:
    types: [created]

jobs:
  publish:
    if: github.repository == 'actions/delete-package-versions' || vars.IMMUTABLE_ACTION_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
    - name: Checking out
      uses: actions/checkout@v7
    - name: Publish
      id: publish
      uses: actions/publish-immutable-action@v0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
